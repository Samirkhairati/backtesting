services:
  postgres:
    image: postgres:16-alpine
    container_name: backtesting_postgres
    profiles: ["dev", "prod", "test"]
    restart: unless-stopped
    env_file: .env
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-backtesting}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrations:
    image: migrate/migrate:v4.18.1
    container_name: backtesting_migrations
    profiles: ["dev", "prod", "test"]
    env_file: .env
    volumes:
      - ./core/db/migrations:/migrations
    command: ["-path", "/migrations", "-database", "${DATABASE_URL}", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  api-dev:
    build:
      context: .
      target: dev
    container_name: backtesting_api_dev
    profiles: ["dev"]
    networks:
      default:
        aliases: [api]
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    volumes:
      - .:/app

      - go_build_cache:/root/.cache/go-build
    env_file: .env
    command: sh -c "go mod tidy && air -c .air/api.toml"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  api-prod:
    build:
      context: .
      target: prod
      args:
        - SERVICE=api
    image: ${IMAGE_REGISTRY:-}backtesting-api:${IMAGE_TAG:-latest}
    container_name: backtesting_api_prod
    profiles: ["prod"]
    restart: unless-stopped
    networks:
      default:
        aliases: [api]
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    env_file: .env
    environment:
      GIN_MODE: release
      ENV: production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      coordinator-prod:
        condition: service_started

  worker-dev:
    build:
      context: .
      target: dev
    profiles: ["dev"]
    volumes:
      - .:/app

      - go_build_cache:/root/.cache/go-build
    env_file: .env
    command: sh -c "go mod tidy && air -c .air/worker.toml"
    depends_on:
      postgres:
        condition: service_healthy

  worker-prod:
    build:
      context: .
      target: prod
      args:
        - SERVICE=worker
    image: ${IMAGE_REGISTRY:-}backtesting-worker:${IMAGE_TAG:-latest}
    profiles: ["prod"]
    restart: unless-stopped
    env_file: .env
    environment:
      GIN_MODE: release
      ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  test:
    build:
      context: .
      target: dev
    container_name: backtesting_test
    profiles: ["test"]
    volumes:
      - .:/app

      - go_build_cache:/root/.cache/go-build
    env_file: .env
    command: sh -c "go mod tidy && go test ./... -v"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  coordinator-dev:
    build:
      context: .
      target: dev
    container_name: backtesting_coordinator_dev
    profiles: ["dev"]
    networks:
      default:
        aliases: [coordinator]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${COORDINATOR_HOST_PORT:-50051}:50051"
    volumes:
      - .:/app

      - go_build_cache:/root/.cache/go-build
    env_file: .env
    command: sh -c "go mod tidy && air -c .air/coordinator.toml"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  coordinator-prod:
    build:
      context: .
      target: prod
      args:
        - SERVICE=coordinator
    image: ${IMAGE_REGISTRY:-}backtesting-coordinator:${IMAGE_TAG:-latest}
    container_name: backtesting_coordinator_prod
    profiles: ["prod"]
    restart: unless-stopped
    networks:
      default:
        aliases: [coordinator]
    env_file: .env
    environment:
      GIN_MODE: release
      ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  ingestion-dev:
    build:
      context: .
      dockerfile: ./ingestion/Dockerfile
      target: dev
    profiles: ["dev"]
    volumes:
      - ./ingestion:/app
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  ingestion-prod:
    build:
      context: .
      dockerfile: ./ingestion/Dockerfile
      target: prod
    image: ${IMAGE_REGISTRY:-}backtesting-ingestion:${IMAGE_TAG:-latest}
    profiles: ["prod"]
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  client-dev:
    build:
      context: ./client
      target: dev
    container_name: backtesting_client_dev
    profiles: ["dev"]
    ports:
      - "${CLIENT_HOST_PORT:-5173}:5173"
    environment:
      - CI=true
      - API_PROXY_TARGET=http://api:8080
    volumes:
      - ./client:/app
      - /app/node_modules
    command: sh -c "pnpm install && pnpm run dev --host"

  client-test:
    build:
      context: ./client
      target: dev
    container_name: backtesting_client_test
    profiles: ["test"]
    environment:
      - CI=true
    volumes:
      - ./client:/app
      - /app/node_modules
    command: sh -c "pnpm install && pnpm run lint && pnpm run build"

  client-prod:
    build:
      context: ./client
      target: prod
    image: ${IMAGE_REGISTRY:-}backtesting-client:${IMAGE_TAG:-latest}
    container_name: backtesting_client_prod
    profiles: ["prod"]
    restart: unless-stopped
    environment:
      # Where nginx forwards /api/ (service alias + internal port)
      API_UPSTREAM: ${API_UPSTREAM:-api:8080}
    ports:
      - "${CLIENT_PROD_HOST_PORT:-80}:80"
    depends_on:
      api-prod:
        condition: service_healthy

  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.6
    container_name: backtesting_kafka
    profiles: ["dev", "prod", "test"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    command:
      - redpanda
      - start
      - --default-log-level=warn
      - --smp 1
      - --memory ${REDPANDA_MEMORY:-1G}
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:${KAFKA_EXTERNAL_PORT:-19092}
      - --advertise-kafka-addr internal://kafka:9092,external://${KAFKA_ADVERTISE_HOST:-localhost}:${KAFKA_EXTERNAL_PORT:-19092}
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:${KAFKA_PROXY_PORT:-18082}
      - --advertise-pandaproxy-addr internal://kafka:8082,external://${KAFKA_ADVERTISE_HOST:-localhost}:${KAFKA_PROXY_PORT:-18082}
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:${KAFKA_SCHEMA_PORT:-18081}
      - --rpc-addr 0.0.0.0:33145
      - --advertise-rpc-addr kafka:33145
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${KAFKA_SCHEMA_PORT:-18081}:18081"
      - "${BIND_ADDRESS:-127.0.0.1}:${KAFKA_PROXY_PORT:-18082}:18082"
      - "${BIND_ADDRESS:-127.0.0.1}:${KAFKA_EXTERNAL_PORT:-19092}:19092"
      - "${BIND_ADDRESS:-127.0.0.1}:${KAFKA_ADMIN_PORT:-19644}:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data

  kafka-init:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.6
    container_name: backtesting_kafka_init
    profiles: ["dev", "prod", "test"]
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/bash", "-c" ]
    command: 
      - |
        echo 'Waiting for Redpanda to be ready...' &&
        for i in {1..10}; do
          rpk cluster info --brokers kafka:9092 && break || sleep 2;
        done &&
        rpk topic create event-stream -p 3 -r 1 --brokers kafka:9092 || true &&
        rpk topic create ingestion-jobs -p 10 -r 1 --brokers kafka:9092 || true &&
        rpk topic create ingestion-completed-jobs -p 3 -r 1 --brokers kafka:9092 || true &&
        rpk topic create backtesting-jobs -p 10 -r 1 --brokers kafka:9092 || true &&
        rpk topic create backtesting-completed-jobs -p 3 -r 1 --brokers kafka:9092 || true &&
        rpk topic create worker-heartbeats -p 3 -r 1 --brokers kafka:9092 || true &&
        rpk topic create backtesting-job-events -p 3 -r 1 --brokers kafka:9092 || true &&
        rpk topic create ingestion-job-events -p 3 -r 1 --brokers kafka:9092 || true &&
        rpk topic create event-stream -p 3 -r 1 --brokers kafka:9092 || true

  redis:
    image: redis:7-alpine
    container_name: backtesting_redis
    profiles: ["dev", "prod", "test"]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redpanda_data:
  redis_data:
  go_build_cache:

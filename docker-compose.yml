services:
  postgres:
    image: postgres:16-alpine
    container_name: backtesting_postgres
    profiles: ["dev", "prod"]
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d backtesting"]
      interval: 5s
      timeout: 5s
      retries: 5

  engine-dev:
    build:
      context: ./engine
      target: dev
    container_name: backtesting_engine_dev
    profiles: ["dev"]
    volumes:
      - ./engine:/app
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  engine-prod:
    build:
      context: ./engine
      target: prod
    container_name: backtesting_engine_prod
    profiles: ["prod"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

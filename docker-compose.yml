services:
  postgres:
    image: postgres:16-alpine
    container_name: backtesting_postgres
    profiles: ["dev", "prod"]
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d backtesting"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker-dev:
    build:
      context: .
      target: dev
    container_name: backtesting_worker_dev
    profiles: ["dev"]
    volumes:
      - .:/app
    env_file: .env
    command: sh -c "go mod tidy && air"
    depends_on:
      postgres:
        condition: service_healthy

  worker-prod:
    build:
      context: .
      target: prod
    container_name: backtesting_worker_prod
    profiles: ["prod"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

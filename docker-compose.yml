services:
  postgres:
    image: postgres:16-alpine
    container_name: backtesting_postgres
    profiles: ["dev", "prod", "test"]
    env_file: .env
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d backtesting"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrations:
    image: migrate/migrate
    container_name: backtesting_migrations
    profiles: ["dev", "prod", "test"]
    env_file: .env
    volumes:
      - ./core/db/migrations:/migrations
    command: ["-path", "/migrations", "-database", "postgres://postgres:postgres@postgres:5432/backtesting?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  api-dev:
    build:
      context: .
      target: dev
    container_name: backtesting_api_dev
    profiles: ["dev"]
    ports:
      - "${API_HOST_PORT}:8080"
    volumes:
      - .:/app
    env_file: .env
    command: sh -c "go mod tidy && air -c .air/api.toml"
    depends_on:
      postgres:
        condition: service_healthy

  api-prod:
    build:
      context: .
      target: prod
      args:
        - SERVICE=api
    container_name: backtesting_api_prod
    profiles: ["prod"]
    ports:
      - "${API_HOST_PORT}:8080"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  worker-dev:
    build:
      context: .
      target: dev
    container_name: backtesting_worker_dev
    profiles: ["dev"]
    volumes:
      - .:/app
    env_file: .env
    command: sh -c "go mod tidy && air -c .air/worker.toml"
    depends_on:
      postgres:
        condition: service_healthy

  worker-prod:
    build:
      context: .
      target: prod
      args:
        - SERVICE=worker
    container_name: backtesting_worker_prod
    profiles: ["prod"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  test:
    build:
      context: .
      target: dev
    container_name: backtesting_test
    profiles: ["test"]
    volumes:
      - .:/app
    env_file: .env
    command: sh -c "go mod tidy && go test ./... -v"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  coordinator-dev:
    build:
      context: .
      target: dev
    container_name: backtesting_coordinator_dev
    profiles: ["dev"]
    ports:
      - "${COORDINATOR_HOST_PORT}:50051"
    volumes:
      - .:/app
    env_file: .env
    command: sh -c "go mod tidy && air -c .air/coordinator.toml"
    depends_on:
      postgres:
        condition: service_healthy

  coordinator-prod:
    build:
      context: .
      target: prod
      args:
        - SERVICE=coordinator
    container_name: backtesting_coordinator_prod
    profiles: ["prod"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  ingestion-dev:
    build:
      context: .
      dockerfile: ./ingestion/Dockerfile
      target: dev
    container_name: backtesting_ingestion_dev
    profiles: ["dev"]
    ports:
      - "${INGESTION_HOST_PORT}:50052"
    volumes:
      - ./ingestion:/app
      - ./core/proto:/app/core/proto
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  ingestion-prod:
    build:
      context: .
      dockerfile: ./ingestion/Dockerfile
      target: prod
    container_name: backtesting_ingestion_prod
    profiles: ["prod"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  client-dev:
    build:
      context: ./client
      target: dev
    container_name: backtesting_client_dev
    profiles: ["dev"]
    ports:
      - "${CLIENT_HOST_PORT}:5173"
    volumes:
      - ./client:/app
      - /app/node_modules

  client-test:
    build:
      context: ./client
      target: dev
    container_name: backtesting_client_test
    profiles: ["test"]
    environment:
      - CI=true
    volumes:
      - ./client:/app
      - /app/node_modules
    command: sh -c "pnpm install && pnpm run lint && pnpm run build"

  client-prod:
    build:
      context: ./client
      target: prod
    container_name: backtesting_client_prod
    profiles: ["prod"]
    ports:
      - "${CLIENT_PROD_HOST_PORT}:80"

volumes:
  postgres_data:

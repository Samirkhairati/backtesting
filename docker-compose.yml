services:
  postgres:
    image: postgres:16-alpine
    container_name: backtesting_postgres
    profiles: ["dev", "prod", "test"]
    env_file: .env.dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d backtesting"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrations:
    image: migrate/migrate
    container_name: backtesting_migrations
    profiles: ["dev", "prod", "test"]
    env_file: .env.dev
    volumes:
      - ./core/db/migrations:/migrations
    command: ["-path", "/migrations", "-database", "postgres://postgres:postgres@postgres:5432/backtesting?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  api-dev:
    build:
      context: .
      target: dev
    container_name: backtesting_api_dev
    profiles: ["dev"]
    ports:
      - "${API_HOST_PORT:-8080}:${API_CONTAINER_PORT:-8080}"
    volumes:
      - .:/app
    env_file: .env.dev
    command: sh -c "go mod tidy && air -c .air.api.toml"
    depends_on:
      postgres:
        condition: service_healthy

  api-prod:
    build:
      context: .
      target: prod
      args:
        - SERVICE=api
    container_name: backtesting_api_prod
    profiles: ["prod"]
    ports:
      - "${API_HOST_PORT:-8080}:${API_CONTAINER_PORT:-8080}"
    env_file: .env.prod
    depends_on:
      postgres:
        condition: service_healthy

  worker-dev:
    build:
      context: .
      target: dev
    container_name: backtesting_worker_dev
    profiles: ["dev"]
    volumes:
      - .:/app
    env_file: .env.dev
    command: sh -c "go mod tidy && air -c .air.toml"
    depends_on:
      postgres:
        condition: service_healthy

  worker-prod:
    build:
      context: .
      target: prod
      args:
        - SERVICE=worker
    container_name: backtesting_worker_prod
    profiles: ["prod"]
    env_file: .env.prod
    depends_on:
      postgres:
        condition: service_healthy

  test:
    build:
      context: .
      target: dev
    container_name: backtesting_test
    profiles: ["test"]
    volumes:
      - .:/app
    env_file: .env.dev
    command: sh -c "go mod tidy && go test ./... -v"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

volumes:
  postgres_data:

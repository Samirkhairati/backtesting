services:
  postgres:
    image: postgres:16-alpine
    container_name: backtesting_postgres
    profiles: ["dev", "prod", "test"]
    env_file: .env
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d backtesting"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrations:
    image: migrate/migrate
    container_name: backtesting_migrations
    profiles: ["dev", "prod", "test"]
    env_file: .env
    volumes:
      - ./core/db/migrations:/migrations
    command: ["-path", "/migrations", "-database", "postgres://postgres:postgres@postgres:5432/backtesting?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  api-dev:
    build:
      context: .
      target: dev
    container_name: backtesting_api_dev
    profiles: ["dev"]
    ports:
      - "${API_HOST_PORT}:8080"
    volumes:
      - .:/app
    env_file: .env
    command: sh -c "go mod tidy && air -c .air/api.toml"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  api-prod:
    build:
      context: .
      target: prod
      args:
        - SERVICE=api
    container_name: backtesting_api_prod
    profiles: ["prod"]
    ports:
      - "${API_HOST_PORT}:8080"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  worker-dev:
    build:
      context: .
      target: dev
    container_name: backtesting_worker_dev
    profiles: ["dev"]
    volumes:
      - .:/app
    env_file: .env
    command: sh -c "go mod tidy && air -c .air/worker.toml"
    depends_on:
      postgres:
        condition: service_healthy

  worker-prod:
    build:
      context: .
      target: prod
      args:
        - SERVICE=worker
    container_name: backtesting_worker_prod
    profiles: ["prod"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  test:
    build:
      context: .
      target: dev
    container_name: backtesting_test
    profiles: ["test"]
    volumes:
      - .:/app
    env_file: .env
    command: sh -c "go mod tidy && go test ./... -v"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  coordinator-dev:
    build:
      context: .
      target: dev
    container_name: backtesting_coordinator_dev
    profiles: ["dev"]
    ports:
      - "${COORDINATOR_HOST_PORT}:50051"
    volumes:
      - .:/app
    env_file: .env
    command: sh -c "go mod tidy && air -c .air/coordinator.toml"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  coordinator-prod:
    build:
      context: .
      target: prod
      args:
        - SERVICE=coordinator
    container_name: backtesting_coordinator_prod
    profiles: ["prod"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  ingestion-dev:
    build:
      context: .
      dockerfile: ./ingestion/Dockerfile
      target: dev
    container_name: backtesting_ingestion_dev
    profiles: ["dev"]
    volumes:
      - ./ingestion:/app
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  ingestion-prod:
    build:
      context: .
      dockerfile: ./ingestion/Dockerfile
      target: prod
    container_name: backtesting_ingestion_prod
    profiles: ["prod"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  client-dev:
    build:
      context: ./client
      target: dev
    container_name: backtesting_client_dev
    profiles: ["dev"]
    ports:
      - "${CLIENT_HOST_PORT}:5173"
    volumes:
      - ./client:/app
      - /app/node_modules

  client-test:
    build:
      context: ./client
      target: dev
    container_name: backtesting_client_test
    profiles: ["test"]
    environment:
      - CI=true
    volumes:
      - ./client:/app
      - /app/node_modules
    command: sh -c "pnpm install && pnpm run lint && pnpm run build"

  client-prod:
    build:
      context: ./client
      target: prod
    container_name: backtesting_client_prod
    profiles: ["prod"]
    ports:
      - "${CLIENT_PROD_HOST_PORT}:80"

  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: backtesting_kafka
    profiles: ["dev", "prod", "test"]
    command:
      - redpanda
      - start
      - --default-log-level=warn
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://kafka:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://kafka:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr 0.0.0.0:33145
      - --advertise-rpc-addr kafka:33145
    ports:
      - "18081:18081"
      - "18082:18082"
      - "19092:19092"
      - "19644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data

  kafka-init:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: backtesting_kafka_init
    profiles: ["dev", "prod", "test"]
    depends_on:
      - kafka
    entrypoint: [ "/bin/bash", "-c" ]
    command: 
      - |
        echo 'Waiting for Redpanda to be ready...' &&
        for i in {1..10}; do
          rpk cluster info --brokers kafka:9092 && break || sleep 2;
        done &&
        rpk topic create event-stream -p 3 -r 1 --brokers kafka:9092 || true &&
        rpk topic create ingestion-jobs -p 3 -r 1 --brokers kafka:9092 || true &&
        rpk topic create ingestion-completed-jobs -p 3 -r 1 --brokers kafka:9092 || true &&
        rpk topic create backtesting-jobs -p 3 -r 1 --brokers kafka:9092 || true &&
        rpk topic create backtesting-completed-jobs -p 3 -r 1 --brokers kafka:9092 || true

  redis:
    image: redis:7-alpine
    container_name: backtesting_redis
    profiles: ["dev", "prod", "test"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redpanda_data:
  redis_data:

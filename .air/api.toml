root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  bin = "./tmp/api"
  include_ext = ["go", "tpl", "tmpl", "html", "env"]
  exclude_dir = ["tmp", "vendor", "node_modules", "frontend", "cmd/worker", "cmd/ingestion", "cmd/migrate"]
  exclude_regex = ["_test.go"]
  delay = 1000
  stop_on_error = true
  log = "air_api_errors.log"

[log]
  time = false

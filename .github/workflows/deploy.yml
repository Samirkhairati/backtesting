name: Deploy

# Runs after CI succeeds on main, or manually. Builds the production images,
# pushes them to GitHub Container Registry, then (optionally) deploys over SSH.
on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push ${{ matrix.name }}
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: api,         context: ".",      file: "Dockerfile",              build_args: "SERVICE=api" }
          - { name: coordinator, context: ".",      file: "Dockerfile",              build_args: "SERVICE=coordinator" }
          - { name: worker,      context: ".",      file: "Dockerfile",              build_args: "SERVICE=worker" }
          - { name: ingestion,   context: ".",      file: "ingestion/Dockerfile",    build_args: "" }
          - { name: client,      context: "client", file: "client/Dockerfile",       build_args: "" }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Compute image name
        id: img
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "ref=ghcr.io/${owner}/backtesting-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      # Servers are a mix of amd64 (Azure) and arm64 (Oracle Ampere)
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: prod
          platforms: linux/amd64,linux/arm64
          build-args: ${{ matrix.build_args }}
          push: true
          tags: |
            ${{ steps.img.outputs.ref }}:${{ github.event.workflow_run.head_sha || github.sha }}
            ${{ steps.img.outputs.ref }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy to ${{ matrix.target }}
    needs: publish
    runs-on: ubuntu-latest
    # Create a GitHub "production" environment to add required reviewers
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          # secret_prefix selects the secret set: DEPLOY_* (azure), DEPLOY_ORACLE_* (oracle)
          - { target: azure,  secret_prefix: DEPLOY }
          - { target: oracle, secret_prefix: DEPLOY_ORACLE }
    env:
      DEPLOY_HOST: ${{ secrets[format('{0}_HOST', matrix.secret_prefix)] }}
    steps:
      - uses: actions/checkout@v4
        if: env.DEPLOY_HOST != ''
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Deploy over SSH
        if: env.DEPLOY_HOST != ''
        env:
          DEPLOY_USER: ${{ secrets[format('{0}_USER', matrix.secret_prefix)] }}
          DEPLOY_PATH: ${{ secrets[format('{0}_PATH', matrix.secret_prefix)] }}
          DEPLOY_SSH_KEY: ${{ secrets[format('{0}_SSH_KEY', matrix.secret_prefix)] }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets[format('{0}_KNOWN_HOSTS', matrix.secret_prefix)] }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          echo "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          SSH="ssh -i ~/.ssh/id_deploy $DEPLOY_USER@$DEPLOY_HOST"
          REGISTRY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/"

          # Compose file + SQL migrations are the only repo files the server needs
          tar czf - docker-compose.yml core/db/migrations | $SSH "mkdir -p '$DEPLOY_PATH' && tar xzf - -C '$DEPLOY_PATH'"

          echo "$GHCR_TOKEN" | $SSH "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"
          # Only our own images change between deploys. Third-party images (postgres,
          # redis, redpanda, migrate) are pinned, so `up` pulls them only if missing;
          # re-pulling them every time made deploys depend on Docker Hub being reachable.
          $SSH "bash -s" <<EOF
          set -euo pipefail
          cd '$DEPLOY_PATH'
          export IMAGE_REGISTRY='$REGISTRY' IMAGE_TAG='$IMAGE_TAG'
          for i in 1 2 3; do
            if docker compose --profile prod pull api-prod coordinator-prod worker-prod ingestion-prod client-prod; then
              break
            fi
            [ "\$i" = 3 ] && { echo "pull failed after 3 attempts"; exit 1; }
            echo "pull failed (attempt \$i), retrying in 10s..."; sleep 10
          done
          docker compose --profile prod up -d --no-build --remove-orphans
          docker image prune -f
          EOF

      - name: Skipped
        if: env.DEPLOY_HOST == ''
        run: echo "${{ matrix.secret_prefix }}_HOST secret not set - images were pushed to GHCR but nothing was deployed."

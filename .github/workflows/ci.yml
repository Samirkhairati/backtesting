name: CI Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # docker-compose.yml reads .env (gitignored); CI uses the example values
      - name: Create .env from example
        run: cp .env.example .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Backend Tests
        run: docker compose --profile test run --rm test

      - name: Run Frontend Tests and Linting
        run: docker compose --profile test run --rm client-test

  build:
    name: Build and Smoke-test Production Stack
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create .env from example
        run: |
          cp .env.example .env
          # Prod services refuse placeholder secrets; use a throwaway one
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|" .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production images
        run: docker compose --profile prod build

      - name: Start production stack
        run: docker compose --profile prod up -d --wait --wait-timeout 180

      - name: Smoke test
        run: |
          set -e
          curl -fsS http://localhost:8080/health
          curl -fsS -o /dev/null http://localhost/
          # Through the nginx proxy; unauthenticated => 401 proves it reached the API
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/api/v1/experiments)" = "401"

      - name: Dump logs on failure
        if: failure()
        run: docker compose --profile prod logs --no-color --tail=100

      - name: Tear down
        if: always()
        run: docker compose --profile prod down -v

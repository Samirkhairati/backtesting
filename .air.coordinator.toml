root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/coordinator ./cmd/coordinator"
  bin = "./tmp/coordinator"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "client"]
  exclude_regex = ["_test.go"]
  include_ext = ["go", "tpl", "tmpl", "html"]

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/worker ./cmd/worker"
  bin = "./tmp/worker"
  include_ext = ["go", "tpl", "tmpl", "html", "env"]
  exclude_dir = ["tmp", "vendor", "node_modules", "frontend"]
  exclude_regex = ["_test.go"]
  delay = 1000
  stop_on_error = true
  log = "air_errors.log"

[log]
  time = false
